<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Customs: App Check</title>
    <style>
      /* Self-contained so it opens with a double-click (no server needed). */
      :root {
        --navy: #0e1b3d;
        --blue: #1f4fb8;
        --paper: #f7f9fc;
        --border: #d9e1ef;
        --muted: #4f5a72;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--navy);
        font-family: "Times New Roman", Times, serif;
        line-height: 1.55;
      }
      header {
        background: var(--navy);
        color: #fff;
        padding: 2rem 1.5rem;
      }
      header h1 {
        margin: 0 0 0.3rem;
        font-size: 2rem;
      }
      header p {
        margin: 0;
        opacity: 0.85;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      section {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      h2 {
        margin: 0 0 1rem;
        color: var(--navy);
        font-size: 1.5rem;
        border-bottom: 3px solid var(--blue);
        padding-bottom: 0.4rem;
      }
      figure {
        margin: 0;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      figcaption {
        margin-top: 0.8rem;
        font-size: 1.05rem;
      }
      .placeholder {
        display: grid;
        place-items: center;
        min-height: 220px;
        border: 2px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Campus Customs: App Check</h1>
      <p>Site testing screenshots for Problem 11. Click any screenshot to open it full size.</p>
    </header>
    <main>
      <section id="chat-inventory-check">
        <h2>Chat inventory check</h2>
        <figure>
          <a href="screenshots/chat-inventory-check.webp"><img src="screenshots/chat-inventory-check.webp" alt="Chat inventory check: a logged-in shopper asking the chatbot whether the 2025 Yale vs. Harvard shirt comes in a large, and the chatbot replying that size L is in stock with 2 left, with the shirt's product card below" /></a>
          <figcaption>Logged in as Test User, a shopper asks the chatbot whether the 2025 Yale vs. Harvard shirt is available in a large, and the bot checks the database and replies that size L is in stock with 2 left, showing the shirt's product card right in the chat.</figcaption>
        </figure>
      </section>

      <section id="search-result-cards">
        <h2>Search result cards</h2>
        <figure>
          <a href="screenshots/search-result-cards.png"><img src="screenshots/search-result-cards.png" alt="Search result cards: the 2025 Yale Vs Harvard T Shirt product page, opened from the chat's product card, showing the large photo, $32.00 price, size buttons, and size-by-size stock, with the chat still open beside it" /></a>
          <figcaption>Clicking the product card the chatbot returned opens the full 2025 Yale Vs Harvard T Shirt page, with a large photo, the $32.00 price, size buttons, and stock by size (confirming "Only 2 left" in L), while the chat stays open on the side.</figcaption>
        </figure>
      </section>

      <section id="problem-9-feature">
        <h2>Problem 9 feature</h2>
        <figure>
          <a href="screenshots/problem-9-favorites.png"><img src="screenshots/problem-9-favorites.png" alt="Problem 9 feature: the Your favorites page showing 4 saved T-shirts as product cards, each with a filled red heart and a gold Add to cart button" /></a>
          <figcaption>The Problem 9 Favorites feature shows Test User's 4 saved T-shirts on the "Your favorites" page as regular product cards, each with a filled red heart (saved) and a gold Add to cart button.</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
